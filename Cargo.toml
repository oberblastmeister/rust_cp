[workspace]
members = [
    "crates/cargo-cp",
    "crates/cp-library",
    "crates/fuzz",
    "crates/solutions",
]
default-members = ["crates/solutions"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
